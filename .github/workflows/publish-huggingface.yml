name: Publish research model to Hugging Face

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: huggingface-publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false
    runs-on: ubuntu-latest
    env:
      HF_REPO_ID: carloyoung/Delta-Neural-Operator-DNO
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - name: Checkout selected source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify Hugging Face credential exists
        id: credentials
        shell: bash
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::HF_TOKEN secret is not configured; publication skipped."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install publishing dependency
        if: steps.credentials.outputs.available == 'true'
        run: python -m pip install 'huggingface_hub>=0.29,<2'
      - name: Publish approved DNO files
        if: steps.credentials.outputs.available == 'true'
        run: python publishing/publish_hf.py
